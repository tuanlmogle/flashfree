<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var path = location.pathname;
      if (path.endsWith("/")) return;
      var last = path.split("/").pop() || "";
      if (/\.[a-z0-9]+$/i.test(last)) return;
      location.replace(path + "/" + location.search + location.hash);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3ecdf">
  <title>FlashFree — từ vựng tiếng Anh</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5f6b'/%3E%3Crect x='7' y='6' width='18' height='20' rx='3' fill='%23fffdf8'/%3E%3Cpath d='M11 13h10M11 17h7' stroke='%231f5f6b' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="brand">FlashFree</div>
      <p class="topmeta" id="topmeta"></p>
    </header>
    <main id="main"></main>
    <nav class="tabbar" aria-label="Mục chính">
      <button type="button" data-nav="study">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h9.2A2.8 2.8 0 0 1 18 7.3V19l-6-2.4L6 19V4.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        Học
      </button>
      <button type="button" data-nav="decks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="12" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h12v10a2 2 0 0 1-2 2H8" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        Bộ thẻ
      </button>
      <button type="button" data-nav="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Thống kê
      </button>
      <button type="button" data-nav="credits">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5M12 8h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Nguồn
      </button>
    </nav>
  </div>
  <p class="toast" id="toast" role="status" hidden></p>
  <noscript>
    <p class="noscript">FlashFree cần JavaScript để lật thẻ và lưu tiến độ trên máy bạn. Nguồn từ vựng: Wiktionary tiếng Việt (CC BY-SA 4.0), CEFR-J, Octanove, Tatoeba.</p>
  </noscript>
  <script src="js/app.js"></script>
</body>
</html>
